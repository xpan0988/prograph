name: Semantic Core regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install explicit Rust qualification tools
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc_path=$(rustup which --toolchain 1.95.0 rustc)
          echo "PROGRAPH_TEST_RUST_TOOLCHAIN=$(dirname "$rustc_path")" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-12/rust-analyzer-x86_64-unknown-linux-gnu.gz --output "$RUNNER_TEMP/rust-analyzer.gz"
          echo '040cab4e2abc490fadd95c3f6cbc60b941a78761dbc3acf0ec66fd7a97f31db3  '"$RUNNER_TEMP/rust-analyzer.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/rust-analyzer.gz" > "$RUNNER_TEMP/rust-analyzer"
          echo 'fd89304c85f6c1996b036ea8f2c9ad9d3e25a197dbd713661c7fe51ec9dc8e49  '"$RUNNER_TEMP/rust-analyzer" | sha256sum --check
          chmod +x "$RUNNER_TEMP/rust-analyzer"
          "$RUNNER_TEMP/rust-analyzer" --version
          echo "PROGRAPH_TEST_RUST_ANALYZER=$RUNNER_TEMP/rust-analyzer" >> "$GITHUB_ENV"
      - run: npm run lint
      - name: Compile accepted prior writer for actual upgrade oracle
        run: |
          baseline_runtime=$(node scripts/prepare-semantic-baseline.mjs "$RUNNER_TEMP/semantic-baselines")
          echo "PROGRAPH_TEST_BASELINE_RUNTIME=$baseline_runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/semantic-dotnet
        with:
          dotnet-version: '10.0.402'
      - name: Install pinned mainstream semantic qualification tools
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/semantic-dotnet
        run: |
          npm run build:node
          node scripts/install-semantic-producers.mjs "$RUNNER_TEMP/semantic-producers"
      - name: Complete tests, including actual Rust producer
        env:
          PROGRAPH_TEST_ORACLE_SEED: ${{ matrix.node }}
          PROGRAPH_TEST_ORACLE_EVIDENCE: semantic-oracle-results.json
          PROGRAPH_TEST_UPGRADE_EVIDENCE: semantic-upgrade-results.json
        run: npm test -- --reporter=default --reporter=json --outputFile=semantic-test-results.json
      - name: Complete Node and UI build
        run: npm run build
      - name: Transaction and process recovery probes
        run: node scripts/semantic-recovery.mjs semantic-recovery-results.json
      - name: Require executed qualification and recovery evidence
        run: node scripts/verify-ci-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-evidence-node-${{ matrix.node }}
          path: |
            semantic-test-results.json
            semantic-recovery-results.json
            semantic-oracle-results.json
            semantic-upgrade-results.json
            ${{ runner.temp }}/semantic-producers/receipt.json
