name: Semantic Core regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install explicit Rust qualification tools
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc_path=$(rustup which --toolchain 1.95.0 rustc)
          echo "PROGRAPH_TEST_RUST_TOOLCHAIN=$(dirname "$rustc_path")" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-12/rust-analyzer-x86_64-unknown-linux-gnu.gz --output "$RUNNER_TEMP/rust-analyzer.gz"
          echo '040cab4e2abc490fadd95c3f6cbc60b941a78761dbc3acf0ec66fd7a97f31db3  '"$RUNNER_TEMP/rust-analyzer.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/rust-analyzer.gz" > "$RUNNER_TEMP/rust-analyzer"
          chmod +x "$RUNNER_TEMP/rust-analyzer"
          echo "PROGRAPH_TEST_RUST_ANALYZER=$RUNNER_TEMP/rust-analyzer" >> "$GITHUB_ENV"
      - run: npm run lint
      - name: Complete tests, including actual Rust producer
        run: npm test -- --reporter=default --reporter=json --outputFile=semantic-test-results.json
      - run: npm run build
      - name: Transaction and process recovery probes
        run: node scripts/semantic-recovery.mjs semantic-recovery-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-evidence-node-${{ matrix.node }}
          path: |
            semantic-test-results.json
            semantic-recovery-results.json
